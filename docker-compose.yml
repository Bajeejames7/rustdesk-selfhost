services:
  hbbs:
    image: rustdesk/rustdesk-server:1.1.15
    command: ["hbbs", "-r", "${RUSTDESK_HOST:?Set RUSTDESK_HOST to your public hostname or IPv4 address}:21117"]
    working_dir: /root
    volumes:
      - ./data:/root
    ports:
      # Pro-only API port; published as requested, unused by OSS.
      - "21114:21114/tcp"
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"
      - "21118:21118/tcp"
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    image: rustdesk/rustdesk-server:1.1.15
    command: ["hbbr"]
    working_dir: /root
    volumes:
      - ./data:/root
    ports:
      - "21117:21117/tcp"
      - "21119:21119/tcp"
    restart: unless-stopped
